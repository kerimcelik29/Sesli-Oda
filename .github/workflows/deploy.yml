# One-time setup: see README → "Sunucuya otomatik dağıtım".
# Variables: DEPLOY_SSH_HOST, DEPLOY_SSH_PORT, DEPLOY_SSH_USER, DEPLOY_URL
# Optional app settings: APP_PUBLIC_URL, APP_ORIGIN, APP_PORT, API_HOST_PORT,
#   LIVEKIT_API_URL, LIVEKIT_WS_URL
# Secrets: DEPLOY_SSH_KEY, DEPLOY_SSH_KNOWN_HOSTS
# Without DEPLOY_SSH_HOST set (e.g. in forks), deployment is skipped.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sesver-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.DEPLOY_SSH_HOST != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL || 'https://sesver.online' }}
    steps:
      - name: Check out successful revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Prepare deployment SSH key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY" || { echo "::error::Secret DEPLOY_SSH_KEY is not set"; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "::error::Secret DEPLOY_SSH_KNOWN_HOSTS is not set"; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Send app and deploy
        env:
          SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '25416' }}
          SSH_USER: ${{ vars.DEPLOY_SSH_USER || 'root' }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          APP_PUBLIC_URL: ${{ vars.APP_PUBLIC_URL || 'https://sesver.online' }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN || 'https://sesver.online' }}
          APP_PORT: ${{ vars.APP_PORT || '18080' }}
          API_HOST_PORT: ${{ vars.API_HOST_PORT || '13001' }}
          LIVEKIT_API_URL: ${{ vars.LIVEKIT_API_URL }}
          LIVEKIT_WS_URL: ${{ vars.LIVEKIT_WS_URL }}
        run: |
          set -eu
          test -n "$SSH_HOST" || { echo "::error::Variable DEPLOY_SSH_HOST is not set"; exit 1; }
          test -n "$LIVEKIT_WS_URL" || { echo "::error::Variable LIVEKIT_WS_URL must point to the existing LiveKit server"; exit 1; }

          bundle="$RUNNER_TEMP/sesver-bundle"
          install -m 700 -d "$bundle"
          git archive "$SHA" | tar -x -C "$bundle"
          umask 077
          printf '%s\n' \
            "APP_PUBLIC_URL=$APP_PUBLIC_URL" \
            "APP_ORIGIN=$APP_ORIGIN" \
            "APP_PORT=$APP_PORT" \
            "API_HOST_PORT=$API_HOST_PORT" \
            "LIVEKIT_API_URL=$LIVEKIT_API_URL" \
            "LIVEKIT_WS_URL=$LIVEKIT_WS_URL" \
            > "$bundle/.deploy-env"

          tar -czf - -C "$bundle" . |
            ssh -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
              "$SSH_USER@$SSH_HOST" "$SHA"
